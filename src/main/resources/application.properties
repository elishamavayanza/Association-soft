# CONFIGURATION DE LA BASE DE DONNÃÂÃÂES SQLite (Par dÃÂÃÂ©faut)
# ==============================================

# Configuration SQLite
spring.datasource.url=jdbc:sqlite:./association.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# Configuration JPA pour SQLite avec Hibernate 6
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=false
spring.jpa.properties.hibernate.id.new_generator_mappings=true

# Configuration Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true
spring.flyway.mixed=true

# Configuration du fuseau horaire
spring.jackson.time-zone=Africa/Lubumbashi

# DÃÂÃÂ©sactiver la console H2
spring.h2.console.enabled=false

