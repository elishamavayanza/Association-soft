# ==============================================
# PRODUCTION DATABASE CONFIGURATION (MariaDB)
# ==============================================

# MariaDB Database Configuration
spring.datasource.url=${MARIADB_URL:jdbc:mariadb://localhost:3306/AsocSoft}
spring.datasource.username=${MARIADB_USER:AsocSoft}
spring.datasource.password=${MARIADB_PASSWORD:AsocSoft}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA/Hibernate Properties for MariaDB
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Disable H2 Console in Production
spring.h2.console.enabled=false

# ==============================================
# PRODUCTION EMAIL CONFIGURATION
# ==============================================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-production-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-production-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==============================================
# PRODUCTION FILE STORAGE CONFIGURATION
# ==============================================

file.upload-dir=${UPLOAD_DIR:/var/uploads/}
file.storage.type=local

# ==============================================
# PRODUCTION SERVER CONFIGURATION
# ==============================================

server.port=${SERVER_PORT:8087}

# ==============================================
# PRODUCTION SECURITY CONFIGURATION
# ==============================================

# JWT Secret for production (should be set via environment variable)
jwt.secret=${JWT_SECRET:mySecretKeyForProductionEnvironment}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==============================================
# PRODUCTION LOGGING CONFIGURATION
# ==============================================

logging.level.com.org.Association-soft=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# ==============================================
# THIRD PARTY SERVICE KEYS FOR PRODUCTION
# ==============================================

# AWS Configuration
aws.accessKeyId=${AWS_ACCESS_KEY_ID:your-aws-access-key}
aws.secretKey=${AWS_SECRET_KEY:your-aws-secret-key}
aws.region=${AWS_REGION:us-east-1}

# Twilio Configuration
twilio.account.sid=${TWILIO_ACCOUNT_SID:your-twilio-account-sid}
twilio.auth.token=${TWILIO_AUTH_TOKEN:your-twilio-auth-token}
twilio.phone.number=${TWILIO_PHONE_NUMBER:+1234567890}

# Firebase Configuration
firebase.service.account.path=${FIREBASE_SERVICE_ACCOUNT_PATH:firebase-service-account-prod.json}

# APNs Configuration
apns.auth.key.path=${APNS_AUTH_KEY_PATH:apns-auth-key-prod.p8}
apns.team.id=${APNS_TEAM_ID:your-team-id}
apns.key.id=${APNS_KEY_ID:your-key-id}
apns.topic=${APNS_TOPIC:your-app-bundle-id}